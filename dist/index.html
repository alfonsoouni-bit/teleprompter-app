<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter Web</title>
    <link rel="stylesheet" href="css/styles.min.css">
</head>
<body>
    <header class="app-header">
        <h1>Teleprompter Web</h1>
        <div class="status-indicator">
            <span id="status-label">Detenido</span>
            <img id="status-led" src="img/led-inactive.png" alt="Estado del sistema" width="20" height="20">
        </div>
    </header>

    <main class="container">
        <!-- Panel de configuración y edición -->
        <section id="editor-panel" class="panel">
            <label for="script-text">Texto para lectura:</label>
            <textarea id="script-text" rows="12" placeholder="Escriba o pegue aquí el guion..."></textarea>
            
            <div class="controls-toolbar">
                <button type="button" id="btn-paste">Pegar</button>
                <button type="button" id="btn-clear">Limpiar</button>
                <button type="button" id="btn-play">Ejecutar</button>
                <button type="button" id="btn-pause">Pausar</button>
                <button type="button" id="btn-reset">Reiniciar</button>
            </div>

            <div class="settings-toolbar">
                <div class="setting-item">
                    <label for="speed-range">Velocidad:</label>
                    <input type="range" id="speed-range" min="1" max="10" value="2">
                    <span id="speed-value">2</span>
                </div>
                <div class="setting-item">
                    <label for="font-size-range">Tamaño de letra (px):</label>
                    <input type="range" id="font-size-range" min="20" max="80" value="38">
                    <span id="font-size-value">38</span>
                </div>
            </div>
            <p class="shortcut-tip">Atajo: Use la barra espaciadora para alternar entre Pausar y Continuar.</p>
        </section>

        <!-- Visor del teleprompter -->
        <section id="prompter-display" class="prompter-screen">
            <div id="prompter-content" class="scroll-content"></div>
        </section>
    </main>

    <script src="js/app.min.js"></script>
</body>
</html>
